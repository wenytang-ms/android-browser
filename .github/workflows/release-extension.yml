name: Release Chrome extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.0.4-alpha (without v)"
        required: true
        default: "0.0.4-alpha"
        type: string

permissions:
  contents: write

concurrency:
  group: chrome-extension-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Java for the UI helper
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check source formatting
        run: npm run format:check

      - name: Set release and Chrome versions
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: node scripts/release-version.mjs "$REQUESTED_VERSION"

      - name: Run regression tests
        run: npm test

      - name: Build the bundled extension
        run: npm run build

      - name: Package extension
        working-directory: dist/extension
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          zip -q -r "../$ARCHIVE" .
          cd ..
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          unzip -t "$ARCHIVE"

      - name: Preserve packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-${{ steps.version.outputs.version }}
          path: |
            dist/${{ steps.version.outputs.archive }}
            dist/${{ steps.version.outputs.archive }}.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          remote_tags="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          if [ -n "$remote_tags" ]; then
            tag_commit="$(printf '%s\n' "$remote_tags" | tail -n 1 | cut -f 1)"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Release tag already points to another commit; refusing to replace it."
              exit 1
            fi
          fi
          cat > dist/release-notes.md <<'NOTES'
          ## Chrome extension

          Download the `tango-android-share-*.zip` asset and extract it.
          In desktop Chrome 118+, open `chrome://extensions`, enable Developer mode,
          choose **Load unpacked**, and select the extracted folder containing `manifest.json`.

          This package includes Tango, the WebCodecs player, scrcpy-server 2.1,
          the no-APK Android UI helper and third-party notices.
          It supports local/remote touch, drag, keyboard and text input, local-priority takeover,
          and host controls to turn off the phone's physical screen while mirroring continues.
          Local USB mirroring and control do not require Google sign-in or a relay.

          ## New in 0.0.4-alpha: on-demand UI automation and app launch

          On Android 7+ with ADB shell v2, read the current active-window UI tree only when
          requested. The bundled resident UiAutomation helper does not install an APK,
          require an AccessibilityService, open a phone port or continuously refresh the tree.
          Inspect/filter nodes and highlight their bounds on the mirrored screen.

          Execute supported node click, long-click, set/clear text and scroll actions.
          Node references are one-shot and expire after at most 30 seconds; reread the tree
          after any action, input or screen change. Arbitrary coordinate input still uses Tango.

          Launch an installed app by package name using its current-user MAIN/LAUNCHER entry,
          without starting the UI helper. App launch and node actions follow local-priority
          takeover and invalidate old node references. Android acceptance does not prove a
          business task completed: reread the UI tree to confirm. Timeout/interruption outcomes
          can be unknown; no automatic retry, coordinate fallback or ad-skipping is performed.

          UI automation and app launch are local-only. This release does not expose an
          external-agent interface, remote UI tree/actions, arbitrary Shell, an HTTP bridge or MCP.

          ## Local media audio (from 0.0.3-alpha)

          On Android 11+, phone media audio can play in the host's local webpage instead of
          the phone speaker or headset. Calls, notifications and alarms remain unchanged.
          Android 11 must be unlocked when audio capture starts.
          Audio is local-only: no remote audio, microphone capture or recording.

          Keep **Forward phone media audio** enabled before connecting or starting mirroring.
          Browser mute silences only the webpage; it does not restore phone media output.
          Stop mirroring to restore phone output, or stop, disable audio forwarding and restart
          for video-only mirroring. If audio is unavailable, video and input remain available.

          Remote sharing requires the updated HTTPS/WSS relay and Google OIDC configuration.
          Only the Google account that created the share can view or control it.
          The legacy anonymous-link sharing flow is not supported.
          See the repository README for setup, USB driver compatibility and deployment instructions.

          Preliminary local video testing of the first release is recorded in issue #1.
          The new UI helper, semantic actions and app launch still require Android/OEM
          real-device verification. Audio routing and cross-network acceptance testing also remain pending.
          NOTES
          args=(
            release create "$RELEASE_TAG"
            "dist/$ARCHIVE"
            "dist/$ARCHIVE.sha256"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$RELEASE_VERSION"
            --notes-file dist/release-notes.md
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
